<style>
*{box-sizing:border-box}
html{font-size:16px}
@supports(font-size:clamp(1px,1vw,2px)){html{font-size:clamp(14px,1.2vw,22px)}}
html,body{height:100%;margin:0;background:#12002b;color:#fff;font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font-family:inherit}
.hide{display:none!important}
#app{position:fixed;left:0;top:0;right:0;bottom:0}
#v{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}

/* ===== Variables de cada diseño ===== */
.t1{--a1:#ff2d95;--a2:#ff7a00;--glass:rgba(40,8,70,.42);--glass2:rgba(40,8,70,.85)}
.t2{--a1:#ff00e6;--a2:#7a00ff;--glass:rgba(8,0,28,.5);--glass2:rgba(8,0,28,.88)}
.t3{--a1:#ff1f8e;--a2:#ff6a00;--glass:rgba(110,20,10,.36);--glass2:rgba(110,20,10,.85)}

/* ===== Pantalla principal con explosión de color ===== */
#splash{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 1.5rem;overflow:hidden;z-index:3;transition:opacity .35s}
#bg{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#16002e}
#bg i{position:absolute;display:block;will-change:transform}
.t1 #bg i{width:80vmax;height:80vmax;border-radius:50%}
.t1 .b1{left:-25vmax;top:-30vmax;background:radial-gradient(circle,#ff2d95 0,rgba(255,45,149,0) 64%);animation:m1 17s ease-in-out infinite alternate}
.t1 .b2{right:-30vmax;top:-20vmax;background:radial-gradient(circle,#00e5ff 0,rgba(0,229,255,0) 64%);animation:m2 21s ease-in-out infinite alternate}
.t1 .b3{left:5vmax;bottom:-45vmax;background:radial-gradient(circle,#ffe600 0,rgba(255,230,0,0) 64%);animation:m3 19s ease-in-out infinite alternate}
.t1 .b4{right:-25vmax;bottom:-40vmax;background:radial-gradient(circle,#7c4dff 0,rgba(124,77,255,0) 64%);animation:m1 23s ease-in-out infinite alternate-reverse}
.t1 .b5{left:25vmax;top:-5vmax;width:50vmax;height:50vmax;background:radial-gradient(circle,#ff7a00 0,rgba(255,122,0,0) 64%);animation:m2 15s ease-in-out infinite alternate-reverse}
.t2 #bg{background:#04000d}
.t2 .b1{left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;background:conic-gradient(from 0deg,#ff00e6,#00f0ff,#39ff14,#fff200,#ff3d00,#ff00e6);animation:sp 30s linear infinite}
.t2 .b2{left:0;top:0;right:0;bottom:0;background:radial-gradient(circle at 50% 50%,rgba(4,0,13,.1) 0,rgba(4,0,13,.6) 38%,#04000d 80%)}
.t2 .b3,.t2 .b4,.t2 .b5{display:none}
.t3 #bg{background:#ff6a00}
.t3 .b1{left:50%;top:62%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(#ffd400 0 7.5deg,#ff4d00 7.5deg 15deg);animation:sp 120s linear infinite}
.t3 .b2{left:0;top:0;right:0;bottom:0;background:radial-gradient(circle at 50% 62%,#fffbd0 0,rgba(255,251,208,.85) 12%,rgba(255,251,208,0) 46%)}
.t3 .b3{left:0;right:0;bottom:0;height:45%;background:linear-gradient(to top,#ff1f8e,rgba(255,31,142,0))}
.t3 .b4{left:0;right:0;top:0;height:40%;background:linear-gradient(to bottom,rgba(0,190,255,.85),rgba(0,190,255,0))}
.t3 .b5{display:none}
.sc{position:relative;z-index:1}
.t1h{margin:0;font-weight:900;text-transform:uppercase;line-height:.95;font-size:3rem;font-size:clamp(2.2rem,7vw,6rem);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 34px rgba(0,0,0,.4)}
.tvx{font-style:italic;background:linear-gradient(180deg,#fff27a,#ffb300 55%,#ff5a00);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.t2h{display:inline-block;margin:.8rem 0 0;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;color:#fff6a8;font-size:1.6rem;font-size:clamp(1.4rem,3.6vw,3.2rem);text-shadow:0 3px 12px rgba(0,0,0,.7)}
.t2h:after{content:"";display:block;height:.45rem;border-radius:1rem;margin:.1rem auto 0;width:85%;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 12%,#ffe600 88%,rgba(255,255,255,0));transform:rotate(-1.2deg)}
.hint{margin:1.4rem 0 0;font-size:1rem;font-weight:700;text-shadow:0 2px 10px #000,0 0 3px #000}
.hint b{color:#fff27a}

/* ===== Widgets ===== */
#pill{position:absolute;top:1.2rem;right:1.4rem;display:flex;align-items:center;gap:.8rem;padding:.6rem 1.3rem;border-radius:2rem;background:rgba(10,0,25,.7);font-weight:700;font-size:1.15rem;z-index:30}
.dot{width:.9rem;height:.9rem;border-radius:50%;background:#ef2b2b;box-shadow:0 0 10px #ef2b2b}
.sep{width:2px;height:1.4rem;background:rgba(255,255,255,.4)}
#ctl{position:absolute;top:1rem;right:1rem;z-index:30;display:flex;gap:.5rem}
#osd{position:absolute;right:1.4rem;bottom:1.4rem;display:flex;flex-direction:column;padding:.7rem 1.3rem;border:3px solid var(--a2);border-radius:1.2rem;background:rgba(10,0,25,.82);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;z-index:30;pointer-events:none;max-width:90vw}
#osd.on{opacity:1;transform:none}
#osdn{font-weight:700;font-size:1.3rem}
#osds{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;color:#fff27a;font-size:1.15rem}
#osds.er{color:#ffb4b4}
#spin{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border:5px solid rgba(255,255,255,.25);border-top-color:var(--a2);border-radius:50%;animation:rot .8s linear infinite;display:none;z-index:4;pointer-events:none}
#toast{position:absolute;left:50%;bottom:1.4rem;transform:translateX(-50%);padding:.5rem 1.1rem;border-radius:.6rem;font-size:1.05rem;font-weight:700;pointer-events:none;background:rgba(10,0,25,.9);opacity:0;transition:opacity .3s;z-index:60;max-width:90vw;text-align:center}
#err{position:absolute;left:0;right:0;top:0;z-index:80;background:#7a0000;color:#fff;font:14px monospace;padding:.5rem;display:none}

/* ===== Menú de vidrio transparente ===== */
#drawer{position:absolute;left:.8rem;top:.8rem;bottom:.8rem;width:26rem;max-width:85vw;display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.28);border-radius:1.4rem;z-index:40;transform:translateX(-115%);transition:transform .18s;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#drawer.open{transform:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#drawer{background:var(--glass2)}}
.hd{display:flex;align-items:center;gap:.8rem;padding:1rem 1rem .6rem}
.hd svg{width:3.2rem;height:3.2rem;flex:none}
.hn{font-weight:900;font-size:1.25rem;line-height:1.05;text-transform:uppercase;flex:1;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.hn b{color:#fff27a;font-style:italic}
.pad{padding:0 1rem}
#tabs{display:flex;gap:.5rem;padding:.7rem 1rem .8rem}
.tab{padding:.5rem 1rem;border-radius:9999px;background:rgba(255,255,255,.16);white-space:nowrap;font-weight:700;font-size:.9rem;border:0;color:#fff;flex:none}
.tab.on{background:linear-gradient(90deg,var(--a1),var(--a2))}
.tab:focus{outline:2px solid #fff27a}
#p-add{padding:0 1rem .5rem;max-height:46vh;overflow-y:auto;scrollbar-width:none}
#p-add::-webkit-scrollbar,#list::-webkit-scrollbar{display:none}
#p-add.kbo{max-height:72vh}
.in{width:100%;padding:.65rem .8rem;border-radius:.7rem;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1rem;display:block}
.in::placeholder{color:rgba(255,255,255,.6)}
.in:focus{outline:2px solid #fff27a}
.mb{margin-bottom:.5rem}
.rowf{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.btn{padding:.6rem 1rem;border-radius:.7rem;background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;font-weight:700;border:0;font-size:.95rem;display:inline-block}
.btn:focus{outline:2px solid #fff27a}
.b2{background:rgba(255,255,255,.2)}
.bt{background:rgba(10,0,25,.7)}
#fl{cursor:pointer}
#fl input{display:none}
.sm{font-size:.8rem;color:rgba(255,255,255,.85);margin:.4rem 0}
.lr{display:flex;align-items:center;gap:.6rem;padding:.45rem .5rem;margin-top:.4rem;background:rgba(0,0,0,.3);border-radius:.6rem;font-size:.9rem}
.lr input{width:1.5rem;height:1.5rem;accent-color:#ff2d95;flex:none}
.lr input:focus{outline:2px solid #fff27a}
.lr b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt{font-weight:800;font-size:.72rem;color:#7dffa0;flex:none}
.lt.del{color:#ff9b9b}
#kb{margin:.2rem 0 .6rem}
.kr{display:flex;gap:.25rem;margin-bottom:.25rem}
.kk{flex:1;min-width:0;padding:.6rem 0;border-radius:.5rem;background:rgba(255,255,255,.2);color:#fff;border:0;font-size:1rem;font-weight:700;text-align:center}
.kk:focus{outline:3px solid #fff27a;background:var(--a1)}
.kk.sp{background:rgba(255,255,255,.3);font-size:.78rem}
.kk.go2{background:var(--a2)}
#stat{padding:0 1rem .25rem;font-size:.85rem;color:rgba(255,255,255,.85)}
#list{flex:1;min-height:0;overflow-y:auto;padding:0 .6rem .8rem;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.ch{display:flex;align-items:center;gap:1.1rem;width:100%;padding:.7rem 1rem;border-radius:.9rem;background:transparent;border:0;color:#fff;font-size:1.3rem;text-align:left;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ch:hover,.ch:focus{background:rgba(255,255,255,.22);outline:2px solid #fff}
.ch.on,.ch.on:focus{background:linear-gradient(90deg,var(--a1),var(--a2));font-weight:700}
.ic{display:block;width:2rem;height:1.5rem;flex:none;border:.22rem solid #fff;border-radius:.45rem}
.ch.on .ic{width:0;height:0;border-style:solid;border-width:.8rem 0 .8rem 1.4rem;border-color:transparent transparent transparent #fff;border-radius:0}
.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh{position:sticky;top:0;background:rgba(20,5,40,.7);color:#fff27a;font-weight:800;padding:.5rem .8rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;z-index:1;border-radius:.5rem}

@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes m1{to{transform:translate(14vmax,10vmax) scale(1.2)}}
@keyframes m2{to{transform:translate(-12vmax,12vmax) scale(.9)}}
@keyframes m3{to{transform:translate(10vmax,-14vmax) scale(1.15)}}
</style>
</head>
<body class="t1">

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
<defs>
<symbol id="tvi" viewBox="0 0 64 64">
<path d="M20 9L32 21L44 9" fill="none" stroke="#fff27a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="6" y="21" width="52" height="37" rx="9" fill="none" stroke="#fff27a" stroke-width="5"/>
<circle cx="48" cy="35" r="2.6" fill="#fff27a"/>
<circle cx="48" cy="45" r="2.6" fill="#fff27a"/>
</symbol>
</defs>
</svg>

<div id="app">
  <video id="v" autoplay playsinline preload="auto"></video>

  <div id="splash">

    <div class="sc">

    <button id="dz" class="btn bt" aria-label="Cambiar diseño">DISEÑO</button>

        <label id="fl" class="btn b2" tabindex="0">Subir archivos<input id="file" type="file" multiple></label>
        <button id="rl" class="btn">⟳ ACTUALIZAR</button>

      <button id="gt" class="btn b2">Cargar texto</button>

      <div id="lists"></div>

    <div id="stat"></div>
    <div id="list"></div>
  </aside>
</div>

<script>
window.onerror=function(m,s,l){var e=document.getElementById('err');if(e){e.style.display='block';e.textContent='Error: '+m+' (línea '+l+')'}};
var $=function(i){return document.getElementById(i)};
var LS={g:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},r:function(k){try{localStorage.removeItem(k)}catch(e){}}};

var MAXL=8;
var WEST=[
['Grjngo Plex(es)','https://amogonetworx-grjngo-2-eu.plex.wurl.tv/2000.m3u8'],
['Grjngo HD spain','https://86ebcafef90e449fbb9439c196e7d149.mediatailor.us-east-1.amazonaws.com/v1/master/0fb304b2320b25f067414d481a779b77db81760d/RakutenTV-es_GrjngoPeliculasDelOeste-1/playlist.m3u8'],
['Grjngo','https://amogonetworx-grjngo-2-eu.plex.wurl.tv/2000.m3u8'],
['Grjngo spain','https://amogo-networx-grjngopelculasdeloeste-1-es.rakuten.wurl.tv/playlist.m3u8'],
['Zylo cine Western','https://d2nq34q0i1r3la.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-awohw8g217ho8/CineWestern_ES.m3u8'],
['West','https://cablered.iptvperu.tv:1936/cablered/west/playlist.m3u8']];
var TABS=[{id:'west',t:'WESTERN'},{id:'mine',t:'MIS LISTAS'}];
var TH=['FIESTA','NEÓN','SOL TROPICAL'];

var cur=LS.g('pd2_tab','west'),cache={},OV={},data=[],view=[],pl=[],ix=-1,pix=-1,now=null,menu=false,dbg=false,th=0;
var tt=0,tok=0,rtok=0,zt=0,qt=0,sht=0,ot=0,rec=0,ga=false,silTry=0,sil=0,caps=false;
function tabOf(id){return TABS.filter(function(x){return x.id===id})[0]}
if(!tabOf(cur))cur='west';
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function stat(m){$('stat').textContent=m}
function toast(m){var t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){t.style.opacity=0},2500)}
function splash(on){
  var s=$('splash');clearTimeout(sht);
  if(on){s.style.display='flex';s.style.pointerEvents='auto';setTimeout(function(){s.style.opacity=1},20)}
  else{s.style.opacity=0;s.style.pointerEvents='none';sht=setTimeout(function(){s.style.display='none'},350)}
}
/* ---------- Diseños de color (1 Fiesta · 2 Neón · 3 Sol tropical) ---------- */
function setTheme(n,q){th=n;document.body.className='t'+(n+1);LS.s('pd2_th',n);$('thn').textContent=(n+1)+'/3 · '+TH[n];if(!q)toast('Diseño '+(n+1)+' de 3 · '+TH[n])}
/* ---------- Cartel OSD y reloj ---------- */
function osd(n,name,st){
  $('osdn').textContent='Canal '+n+' • '+name;
  var e=$('osds');e.textContent=st;e.className=st==='Error'?'er':'';
  var o=$('osd');o.classList.add('on');clearTimeout(ot);ot=setTimeout(function(){o.classList.remove('on')},3500);
}
function clk(){var d=new Date(),p=function(n){return('0'+n).slice(-2)};$('clk').textContent=p(d.getHours())+':'+p(d.getMinutes())}
clk();setInterval(clk,15000);

/* ---------- Listas: WESTERN fija + listas cargadas por el usuario ---------- */
function ov(id){return OV[id]||(OV[id]=LS.g('pd2_o_'+id,[]))}
function westList(){return WEST.map(function(w){return{n:w[0],u:w[1],g:'Western',l:''}})}
function manualCh(){var o=[];ov('mine').forEach(function(l){l.ch.forEach(function(c){o.push({n:c.n,u:c.u,g:l.name,l:''})})});return o}
function lists(){
  var a=ov('mine');
  $('cnt').textContent='Listas cargadas: '+a.length+' / '+MAXL;
  $('lists').innerHTML=a.map(function(l,i){return'<label class="lr"><input type="checkbox" class="lc" data-d="'+i+'"><b>'+esc(l.name)+' ('+l.ch.length+')</b><span class="lt">MANTENER LISTA</span></label>'}).join('');
}
function show(id){
  cur=id;LS.s('pd2_tab',id);
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),function(b){b.classList.toggle('on',b.dataset.t===id)});
  $('p-add').classList.toggle('hide',id!=='mine');
  if(id==='mine')lists();
  data=id==='west'?westList():manualCh();
  render(true);
}
function row(c,i){
  return'<button class="ch'+((now&&now.u===c.u&&now.n===c.n)?' on':'')+'" data-i="'+i+'"><span class="ic"></span><span class="tx">Canal '+(i+1)+' • '+esc(c.n)+'</span></button>';
}
function render(focus){
  var q=$('q').value.toLowerCase(),parts=[],my=++rtok;
  var f=data.filter(function(c){return!q||c.n.toLowerCase().indexOf(q)>-1});
  view=[];
  if(cur==='west'){f.forEach(function(c){parts.push(row(c,view.length));view.push(c)})}
  else{
    var order=[],map={};f.forEach(function(c){if(!map[c.g]){map[c.g]=[];order.push(c.g)}map[c.g].push(c)});
    order.forEach(function(g){parts.push('<div class="gh">'+esc(g)+' ('+map[g].length+')</div>');map[g].forEach(function(c){parts.push(row(c,view.length));view.push(c)})});
  }
  var L=$('list'),i=0;L.innerHTML='';
  function chunk(){
    if(my!==rtok)return;
    L.insertAdjacentHTML('beforeend',parts.slice(i,i+60).join(''));i+=60;
    if(i<parts.length)requestAnimationFrame(chunk);
  }
  chunk();
  if(focus&&menu&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){var e=L.querySelector('.ch');if(e)e.focus({preventScroll:true})}
  stat(view.length?view.length+' canales':cur==='mine'?'Aún no hay listas. Pulsa ⌨ Teclado, escribe la URL y pulsa CARGAR.':'Sin resultados.');
}
function mark(){Array.prototype.forEach.call(document.querySelectorAll('.ch'),function(b){var c=view[b.dataset.i];b.classList.toggle('on',!!(c&&now&&c.u===now.u&&c.n===now.n))})}

function parse(t,g){
  t=String(t).replace(/^\uFEFF/,'');
