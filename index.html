
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#087d43">
<title>PLAZA DE LA DIGNIDAD TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
<style>
:root{
 --green:#00e676;--green2:#00a653;--lime:#d7ff45;
 --deep:#052d20;--white:#f4fff7;--gold:#ffe66d;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 font-family:Arial,Helvetica,sans-serif;color:var(--white);
 background:
 radial-gradient(ellipse at 12% 12%,#6be64a 0%,transparent 30%),
 radial-gradient(ellipse at 88% 20%,#00c9a7 0%,transparent 33%),
 radial-gradient(ellipse at 50% 100%,#b6e52b 0%,transparent 38%),
 linear-gradient(135deg,#03432b,#07864b 52%,#00566a);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{
 outline:3px solid var(--lime);outline-offset:3px
}
#app{width:100%;height:100%;position:relative;overflow:hidden}
#topbar{
 height:66px;position:absolute;z-index:12;left:0;right:0;top:0;
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:8px 16px;
 background:linear-gradient(90deg,#003c28f5,#087d43f0,#00616af0);
 border-bottom:2px solid #baff54;
 box-shadow:0 4px 22px #001b14
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
 width:43px;height:43px;flex-shrink:0;border-radius:50%;
 display:grid;place-items:center;font-size:22px;font-weight:1000;color:#064328;
 background:linear-gradient(145deg,#fff,#caffd8 35%,#00e676 75%,#b9ffcb);
 box-shadow:0 0 15px #00ff9d,inset 0 2px 5px #fff
}
.brand-name{
 font-size:clamp(14px,2.2vw,23px);font-weight:1000;letter-spacing:.7px;
 color:#e5ffed;text-shadow:0 0 12px #00ff83;white-space:nowrap
}
.brand-name span{color:var(--lime)}
.top-actions{display:flex;align-items:center;gap:9px}
#clock{font-size:13px;font-weight:bold;color:#e5ffed}
.top-btn,.action-btn{
 color:white;font-weight:900;border:1px solid #a9ffd0;
 border-radius:9px;padding:10px 14px;
 background:linear-gradient(135deg,#087e48,#00b85b);
 box-shadow:0 3px 12px #001b13
}
#open-menu{min-width:112px}
#main{
 position:absolute;inset:66px 0 0;display:flex;
 align-items:stretch;justify-content:center
}
#player-area{position:relative;width:100%;height:100%;background:#000}
#video{width:100%;height:100%;object-fit:contain;background:#000}
#empty-state{
 position:absolute;inset:0;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;padding:20px;
 background:
 radial-gradient(circle at 25% 20%,#aaff4038,transparent 32%),
 radial-gradient(circle at 75% 80%,#00ffb038,transparent 35%),
 linear-gradient(135deg,#06462caa,#006b5aaa);
 pointer-events:none
}
#empty-state .big{
 font-size:clamp(26px,5vw,54px);font-weight:1000;color:#d8ff7a;
 text-shadow:0 0 20px #00e676
}
#empty-state p{color:#f0fff3;font-weight:bold}
#now-playing{
 position:absolute;bottom:18px;left:18px;max-width:75%;
 padding:10px 14px;border:1px solid #00e676;border-radius:10px;
 background:#002b1edb;font-weight:bold;opacity:0;transition:opacity .25s;
 pointer-events:none
}
#now-playing.visible{opacity:1}

/* Pantalla de bienvenida */
#splash{
 position:absolute;inset:0;z-index:30;display:flex;align-items:center;
 justify-content:center;text-align:center;padding:20px;
 background:
 radial-gradient(circle at 20% 20%,#caff5b88,transparent 30%),
 radial-gradient(circle at 80% 75%,#00ffba77,transparent 34%),
 linear-gradient(135deg,#00532f,#00a85b 48%,#006c70);
 transition:opacity .45s
}
#splash.hidden{opacity:0;pointer-events:none}
.splash-card{max-width:760px}
.splash-logo{
 font-size:clamp(36px,7vw,76px);font-weight:1000;line-height:1.05;
 letter-spacing:2px;color:#effff4;
 text-shadow:0 3px 0 #006b3b,0 0 25px #baff35
}
.splash-logo span{color:#d8ff4c}
.slogan{
 margin-top:18px;font-size:clamp(17px,3vw,27px);
 font-weight:1000;letter-spacing:3px;color:#faffd6;
 text-shadow:0 0 12px #00ff91
}
#last-channel-label{margin-top:24px;font-size:15px;color:#effff3;font-weight:bold}
#progress{height:5px;background:#ffffff55;border-radius:9px;margin:24px auto 0;max-width:300px;overflow:hidden}
#progress span{display:block;width:0;height:100%;background:#d7ff3f;animation:loadbar 7s linear forwards}
@keyframes loadbar{to{width:100%}}

/* Menú desplegable animado */
#menu-backdrop{
 position:absolute;inset:66px 0 0;z-index:15;background:#001b1399;
 opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s
}
#menu-backdrop.open{opacity:1;visibility:visible}
#menu{
 position:absolute;z-index:16;left:0;top:66px;bottom:0;
 width:min(410px,90vw);display:flex;flex-direction:column;
 background:linear-gradient(155deg,#075b37 0%,#033b2c 55%,#032b37 100%);
 border-right:3px solid #aaff45;
 box-shadow:12px 0 35px #00170f;
 transform:translateX(-105%);visibility:hidden;
 transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s
}
#menu.open{transform:translateX(0);visibility:visible}
.menu-head{padding:14px 15px 10px;border-bottom:1px solid #ffffff30}
.menu-title{font-size:22px;font-weight:1000;color:#caff66}
.menu-sub{font-size:12px;color:#d4ffe2;margin-top:4px}
.menu-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}
.tab-btn{
 border:1px solid #9bffc0;border-radius:8px;padding:10px 4px;
 background:#ffffff12;color:white;font-weight:900;font-size:12px
}
.tab-btn.active{
 background:linear-gradient(135deg,#caff53,#00d978);
 color:#063b25;border-color:#eaff91;box-shadow:0 0 13px #00e67677
}
#search{
 width:100%;margin-top:11px;padding:11px;border-radius:8px;
 border:1px solid #70dfa1;background:#eafff1;color:#073b26;outline:none
}
#channel-list{overflow:auto;flex:1;padding:8px}
.group-label{padding:10px 8px 5px;color:#caff66;font-size:12px;font-weight:900;text-transform:uppercase}
.channel{
 width:100%;display:flex;align-items:center;gap:10px;text-align:left;
 padding:10px;margin:4px 0;border:1px solid #ffffff20;border-radius:9px;
 color:white;background:linear-gradient(90deg,#ffffff17,#ffffff06)
}
.channel.selected{border-color:#caff45;background:linear-gradient(90deg,#087b43,#07553a)}
.channel-logo{
 width:38px;height:38px;flex:0 0 38px;border-radius:7px;
 background:#e9fff1;color:#075332;display:grid;place-items:center;
 overflow:hidden;font-size:12px;font-weight:bold
}
.channel-logo img{width:100%;height:100%;object-fit:contain}
.channel-info{min-width:0;flex:1}
.channel-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-group{font-size:11px;color:#b8eaca;margin-top:3px}
.fav{
 border:0;background:transparent;color:#ffe66d;font-size:24px;
 padding:5px;min-width:38px
}
#menu-footer{padding:10px 13px;border-top:1px solid #ffffff30;font-size:11px;color:#c4f1d3}

/* Ventanas */
#dialog-overlay{
 position:absolute;inset:0;z-index:40;display:none;align-items:center;
 justify-content:center;padding:14px;background:#001a12d9
}
#dialog-overlay.show{display:flex}
.dialog{
 width:min(550px,100%);max-height:90%;overflow:auto;
 background:linear-gradient(145deg,#06452d,#032c26);
 border:2px solid #00e676;border-radius:15px;padding:18px;
 box-shadow:0 0 35px #00a85a66
}
.dialog h2{margin:0 0 12px;color:#caff70}
.dialog label{display:block;margin:12px 0 6px;font-size:13px;color:#d7ffe3;font-weight:bold}
.dialog input,.dialog select{
 width:100%;padding:12px;border-radius:8px;border:1px solid #78dca3;
 background:#f1fff5;color:#063c28
}
.dialog-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dialog-actions button{flex:1}
.playlist-item{
 display:flex;align-items:center;gap:8px;padding:10px;margin:7px 0;
 background:#ffffff12;border:1px solid #ffffff25;border-radius:8px
}
.playlist-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.small-btn{padding:8px 10px;border-radius:7px;border:1px solid #ffffff55;color:white;background:#087e48;font-weight:bold}
.delete-btn{background:#a92e35}
#toast{
 position:absolute;z-index:60;bottom:20px;left:50%;transform:translateX(-50%);
 background:#002d1c;color:#eaffef;border:1px solid #00e676;
 border-radius:9px;padding:11px 16px;box-shadow:0 5px 20px #0008;
 display:none;max-width:90%;text-align:center
}
#toast.show{display:block}
@media(max-width:600px){
 #topbar{height:58px;padding:6px 9px}
 #main{inset:58px 0 0}
 #menu-backdrop{inset:58px 0 0}
 #menu{top:58px}
 .logo{width:36px;height:36px;font-size:19px}
 .brand-name{font-size:13px;letter-spacing:0}
 #clock{display:none}
 .top-btn{padding:9px;font-size:12px}
}
</style>
</head>

<body>
<div id="app" tabindex="0">

<header id="topbar">
 <div class="brand">
  <div class="logo">▶</div>
  <div class="brand-name">PLAZA DE LA <span>DIGNIDAD TV</span></div>
 </div>
 <div class="top-actions">
  <span id="clock"></span>
  <button class="top-btn" id="open-menu" aria-expanded="false">☰ CANALES</button>
 </div>
</header>

<main id="main">
 <section id="player-area">
  <video id="video" controls playsinline></video>
  <div id="empty-state">
   <div class="big">PLAZA DE LA DIGNIDAD TV</div>
   <p>LA HISTORIA ES NUESTRA</p>
   <p>Presiona OK o CANALES para abrir el menú.</p>
  </div>
  <div id="now-playing"></div>
 </section>
</main>

<div id="menu-backdrop"></div>

<aside id="menu" aria-hidden="true">
 <div class="menu-head">
  <div class="menu-title">☰ MENÚ PRINCIPAL</div>
  <div class="menu-sub" id="channel-count">0 canales disponibles</div>
  <div class="menu-tabs">
   <button class="tab-btn active" data-tab="channels">CANALES</button>
   <button class="tab-btn" data-tab="favorites">★ FAVORITOS</button>
   <button class="tab-btn" data-tab="lists">MIS LISTAS</button>
  </div>
  <input id="search" type="search" placeholder="Buscar canal...">
 </div>
 <div id="channel-list"></div>
 <div id="menu-footer">OK: abrir / seleccionar · ← →: menú · ESC: cerrar</div>
</aside>

<div id="splash">
 <div class="splash-card">
  <div class="splash-logo">PLAZA DE LA<br><span>DIGNIDAD TV</span></div>
  <div class="slogan">LA HISTORIA ES NUESTRA</div>
  <div id="last-channel-label"></div>
  <div id="progress"><span></span></div>
 </div>
</div>

<div id="dialog-overlay">
 <div class="dialog" id="dialog-content"></div>
</div>

<div id="toast"></div>
</div>

<script>
(() => {
"use strict";

const DB_NAME = "PlazaDignidadTV";
const DB_VERSION = 1;
const STORE = "lists";
const MAX_LISTS = 10;

const $ = id => document.getElementById(id);
const video = $("video");

let db = null;
let playlists = [];
let channels = [];
let activeChannelId = null;
let currentTab = "channels";
let menuOpen = false;
let splashFinished = false;
let splashTimer = null;
let hls = null;
let busy = false;
let toastTimer = null;
let channelButtons = [];
let lastChannel = null;

function notify(message) {
 const el = $("toast");
 el.textContent = message;
 el.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer = setTimeout(() => el.classList.remove("show"),4000);
}

function openDB() {
 return new Promise((resolve,reject) => {
  const request = indexedDB.open(DB_NAME,DB_VERSION);
  request.onupgradeneeded = () => {
   const database = request.result;
   if (!database.objectStoreNames.contains(STORE)) {
    database.createObjectStore(STORE,{keyPath:"id"});
   }
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
 });
}

function transaction(mode, action) {
 return new Promise((resolve,reject) => {
  const tx = db.transaction(STORE,mode);
  const store = tx.objectStore(STORE);
  let result;
  try {
   result = action(store);
  } catch(error) {
   reject(error);
   return;
  }
  tx.oncomplete = () => resolve(result && result.result);
  tx.onerror = () => reject(tx.error || new Error("Error de almacenamiento"));
  tx.onabort = () => reject(tx.error || new Error("Operación cancelada"));
 });
}

function getAllLists() {
 return new Promise((resolve,reject) => {
  const tx = db.transaction(STORE,"readonly");
  const request = tx.objectStore(STORE).getAll();
  request.onsuccess = () => resolve(request.result || []);
  request.onerror = () => reject(request.error);
 });
}

function putList(record) {
 return transaction("readwrite",store => store.put(record));
}

function removeList(id) {
 return transaction("readwrite",store => store.delete(id));
}

function newId() {
 return "list-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,9);
}

function getFavorites() {
 try { return JSON.parse(localStorage.getItem("plaza_favorites_v2") || "[]"); }
 catch { return []; }
}
function saveFavorites(values) {
 localStorage.setItem("plaza_favorites_v2",JSON.stringify(values));
}

function isFavorite(channel) {
 return getFavorites().includes(channel.url);
}

function parseM3U(content,playlistId) {
 const lines = String(content || "").replace(/^\uFEFF/,"").split(/\r?\n/);
 const parsed = [];
 let pending = null;

 for (const raw of lines) {
  const line = raw.trim();
  if (!line) continue;

  if (line.startsWith("#EXTINF")) {
   const comma = line.lastIndexOf(",");
   const name = comma >= 0 ? line.slice(comma+1).trim() : "Canal";
   pending = {
    name:name || "Canal",
    group:(line.match(/group-title="([^"]*)"/i) || [,"General"])[1],
    logo:(line.match(/tvg-logo="([^"]*)"/i) || [,""])[1]
   };
   continue;
  }

  if (line.startsWith("#")) continue;

  if (/^(https?:\/\/|rtmp:\/\/|rtsp:\/\/|udp:\/\/)/i.test(line)) {
   parsed.push({
    id:newId(),
    playlistId,
    name:pending?.name || line.split("/").pop() || "Canal",
    group:pending?.group || "General",
    logo:pending?.logo || "",
    url:line
   });
   pending = null;
  }
 }
 return parsed;
}

async function reloadData() {
 playlists = await getAllLists();
 playlists.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
 channels = [];
 playlists.forEach(list => {
  channels.push(...parseM3U(list.content,list.id));
 });
 renderView();
}

function setMenu(open) {
 menuOpen = !!open;
 $("menu").classList.toggle("open",menuOpen);
 $("menu-backdrop").classList.toggle("open",menuOpen);
 $("menu").setAttribute("aria-hidden",String(!menuOpen));
 $("open-menu").setAttribute("aria-expanded",String(menuOpen));
 if (menuOpen) {
  renderView();
  setTimeout(() => {
   if (currentTab === "channels" || currentTab === "favorites") {
    const first = channelButtons[0];
    if (first) first.focus({preventScroll:true});
   } else {
    const first = $("channel-list").querySelector("button");
    if (first) first.focus({preventScroll:true});
   }
  },300);
 }
}

function toggleMenu() {
 setMenu(!menuOpen);
}

function setTab(tab) {
 currentTab = tab;
 document.querySelectorAll(".tab-btn").forEach(button => {
  button.classList.toggle("active",button.dataset.tab === tab);
 });
 $("search").value = "";
 $("search").style.display = tab === "lists" ? "none" : "block";
 renderView();
}

function renderView() {
 document.querySelectorAll(".tab-btn").forEach(button => {
  button.classList.toggle("active",button.dataset.tab === currentTab);
 });
 $("channel-count").textContent =
  playlists.length + "/10 listas · " + channels.length + " canales";
 channelButtons = [];

 if (currentTab === "lists") {
  renderLists();
  return;
 }
 renderChannels();
}

function renderChannels() {
 const query = $("search").value.trim().toLowerCase();
 const favorites = getFavorites();

 let filtered = channels;
 if (currentTab === "favorites") {
  filtered = channels.filter(c => favorites.includes(c.url));
 }
 filtered = filtered.filter(c =>
  c.name.toLowerCase().includes(query) ||
  (c.group || "").toLowerCase().includes(query)
 );

 const container = $("channel-list");
 container.innerHTML = "";

 if (!filtered.length) {
  const empty = document.createElement("div");
  empty.style.cssText = "padding:22px;text-align:center;color:#d8ffe5;line-height:1.7";
  empty.textContent = currentTab === "favorites"
   ? "Todavía no tienes canales favoritos. Marca una estrella ★ en tus canales."
   : "No hay canales disponibles. Pulsa MIS LISTAS para agregar una lista.";
  container.appendChild(empty);
  return;
 }

 const groups = new Map();
 filtered.forEach(channel => {
  const group = currentTab === "favorites" ? "MIS FAVORITOS" : (channel.group || "General");
  if (!groups.has(group)) groups.set(group,[]);
  groups.get(group).push(channel);
 });

 for (const [group,items] of groups) {
  const heading = document.createElement("div");
  heading.className = "group-label";
  heading.textContent = group;
  container.appendChild(heading);

  items.forEach(channel => {
   const row = document.createElement("div");
   row.className = "channel" + (channel.id === activeChannelId ? " selected" : "");
   row.tabIndex = 0;
   row.setAttribute("role","button");

   const logo = document.createElement("div");
   logo.className = "channel-logo";
   if (channel.logo) {
    const img = document.createElement("img");
    img.src = channel.logo;
    img.alt = "";
    img.onerror = () => { logo.textContent = "TV"; };
    logo.appendChild(img);
   } else logo.textContent = "TV";

   const info = document.createElement("div");
   info.className = "channel-info";
   const name = document.createElement("div");
   name.className = "channel-name";
   name.textContent = channel.name;
   const sub = document.createElement("div");
   sub.className = "channel-group";
   const list = playlists.find(p => p.id === channel.playlistId);
   sub.textContent = (list ? list.name + " · " : "") + (channel.group || "General");
   info.append(name,sub);

   const star = document.createElement("button");
   star.type = "button";
   star.className = "fav";
   star.textContent = favorites.includes(channel.url) ? "★" : "☆";
   star.title = "Agregar o quitar favorito";
   star.addEventListener("click",event => {
    event.stopPropagation();
    const next = getFavorites();
    const at = next.indexOf(channel.url);
    if (at >= 0) next.splice(at,1);
    else next.push(channel.url);
    saveFavorites(next);
    renderView();
   });

   row.append(logo,info,star);
   row.addEventListener("click",() => playChannel(channel));
   row.addEventListener("keydown",event => {
    if (event.key === "Enter" || event.keyCode === 13 || event.key === " ") {
     event.preventDefault();
     playChannel(channel);
    }
   });
   container.appendChild(row);
   channelButtons.push(row);
  });
 }
}

function renderLists() {
 const container = $("channel-list");
 container.innerHTML = "";

 const add = document.createElement("button");
 add.className = "action-btn";
 add.style.cssText = "width:100%;margin:7px 0 12px;padding:14px";
 add.textContent = "＋ AGREGAR UNA NUEVA LISTA";
 add.addEventListener("click",openAddDialog);
 container.appendChild(add);

 const count = document.createElement("div");
 count.className = "group-label";
 count.textContent = "LISTAS GUARDADAS · " + playlists.length + " DE 10";
 container.appendChild(count);

 if (!playlists.length) {
  const p = document.createElement("div");
  p.style.cssText = "padding:20px;text-align:center;color:#d8ffe5";
  p.textContent = "Aún no has agregado listas.";
  container.appendChild(p);
 }

 playlists.forEach((list,index) => {
  const item = document.createElement("div");
  item.className = "playlist-item";

  const name = document.createElement("div");
  name.className = "playlist-name";
  name.innerHTML = "";
  const title = document.createElement("strong");
  title.textContent = (index+1) + ". " + list.name;
  const detail = document.createElement("div");
  detail.style.cssText = "font-size:11px;color:#b8eaca;margin-top:4px";
  detail.textContent = list.type.toUpperCase();
  name.append(title,detail);

  const keep = document.createElement("button");
  keep.className = "small-btn";
  keep.textContent = "✓";
  keep.title = "Mantener lista";
  keep.addEventListener("click",() => notify("Esta lista permanece guardada."));

  const del = document.createElement("button");
  del.className = "small-btn delete-btn";
  del.textContent = "BORRAR";
  del.addEventListener("click",() => deletePlaylist(list.id));

  item.append(name,keep,del);
  container.appendChild(item);
 });

 if (playlists.length >= MAX_LISTS) {
  const note = document.createElement("div");
  note.style.cssText = "padding:10px;color:#ffe66d;font-size:12px";
  note.textContent = "Has alcanzado el máximo de 10 listas. Borra una para liberar espacio.";
  container.appendChild(note);
 }
}

async function deletePlaylist(id) {
 if (busy) return;
 const list = playlists.find(p => p.id === id);
 if (!list) return;

 if (!confirm("¿Eliminar la lista «" + list.name + "» y sus canales?")) return;

 busy = true;
 try {
  await removeList(id);
  await reloadData();

  if (activeChannelId && !channels.some(c => c.id === activeChannelId)) {
   activeChannelId = null;
   stopPlayer();
   $("empty-state").style.display = "flex";
  }
  notify("Lista eliminada. Ya puedes agregar otra.");
 } catch(error) {
  notify("No se pudo eliminar la lista. Intenta nuevamente.");
 } finally {
  busy = false;
 }
}

function showDialog(content) {
 $("dialog-content").innerHTML = "";
 $("dialog-content").appendChild(content);
 $("dialog-overlay").classList.add("show");
}
function closeDialog() {
 $("dialog-overlay").classList.remove("show");
 $("dialog-content").innerHTML = "";
}

function openAddDialog() {
 if (playlists.length >= MAX_LISTS) {
  notify("Ya tienes 10 listas. Elimina una para agregar otra.");
  return;
 }

 const form = document.createElement("div");
 const heading = document.createElement("h2");
 heading.textContent = "＋ AGREGAR NUEVA LISTA";
 form.appendChild(heading);

 function addField(labelText,id,element) {
  const label = document.createElement("label");
  label.htmlFor = id;
  label.textContent = labelText;
  element.id = id;
  form.append(label,element);
 }

 const name = document.createElement("input");
 name.placeholder = "Ej. Mi televisión";
 addField("Nombre de la lista","new-list-name",name);

 const type = document.createElement("select");
 [
  ["m3u","M3U"],["m3u8","M3U8"],["raw","GitHub RAW"],["astra","Astra compatible (M3U)"]
 ].forEach(([value,label]) => {
  const option = document.createElement("option");
  option.value = value;option.textContent = label;type.appendChild(option);
 });
 addField("Formato","new-list-type",type);

 const url = document.createElement("input");
 url.type = "url";
 url.placeholder = "http:// o https://";
 addField("Dirección URL de la lista","new-list-url",url);

 const file = document.createElement("input");
 file.type = "file";
 file.accept = ".m3u,.m3u8,.txt";
 addField("O selecciona un archivo de tu dispositivo","new-list-file",file);

 const explanation = document.createElement("p");
 explanation.style.cssText = "font-size:11px;color:#c4f1d3;line-height:1.5";
 explanation.textContent = "Puedes guardar hasta 10 listas. Las listas se conservan en este dispositivo.";
 form.appendChild(explanation);

 const actions = document.createElement("div");
 actions.className = "dialog-actions";
 const save = document.createElement("button");
 save.className = "action-btn";
 save.textContent = "GUARDAR LISTA";
 save.addEventListener("click",() => savePlaylist(name.value,type.value,url.value,file.files[0],save));
 const cancel = document.createElement("button");
 cancel.className = "action-btn";
 cancel.textContent = "CANCELAR";
 cancel.addEventListener("click",closeDialog);
 actions.append(save,cancel);
 form.appendChild(actions);
 showDialog(form);
 setTimeout(() => name.focus(),50);
}

async function savePlaylist(name,type,url,file,button) {
 if (busy) return;
 busy = true;
 button.disabled = true;
 button.textContent = "GUARDANDO...";

 try {
  // Consultar la base de datos directamente antes de aplicar el límite.
  const current = await getAllLists();
  if (current.length >= MAX_LISTS) {
   playlists = current;
   notify("Has alcanzado el máximo de 10 listas.");
   closeDialog();
   await reloadData();
   return;
  }

  let content = "";
  let sourceUrl = "";
  if (file) {
   content = await file.text();
  } else if (url.trim()) {
   const address = url.trim();
   if (!/^https?:\/\//i.test(address)) {
    throw new Error("La dirección debe comenzar con http:// o https://");
   }
   sourceUrl = address;
   const response = await fetch(address,{mode:"cors",cache:"no-store"});
   if (!response.ok) throw new Error("El servidor respondió HTTP " + response.status);
   content = await response.text();
  } else {
   throw new Error("Debes ingresar una URL o seleccionar un archivo.");
  }

  if (!content.trim()) throw new Error("La lista está vacía.");
  if (!/#EXTM3U/i.test(content)) throw new Error("El contenido no parece ser una lista M3U.");

  const record = {
   id:newId(),
   name:name.trim() || "Mi lista " + (current.length+1),
   type,
   content,
   sourceUrl,
   createdAt:Date.now()
  };

  await putList(record);
  await reloadData();
  closeDialog();
  setTab("lists");
  notify("Lista agregada correctamente. " + playlists.length + " de 10.");
 } catch(error) {
  let message = error.message || "No se pudo guardar la lista.";
  if (sourceUrlIsHttp(url) && location.protocol === "https:") {
   message = "El navegador puede bloquear una URL HTTP desde esta página HTTPS. También puede existir una restricción CORS.";
  } else if (/Failed to fetch|NetworkError|Load failed/i.test(message)) {
   message = "No se pudo leer la URL. Comprueba la conexión y los permisos CORS del servidor.";
  }
  notify(message);
 } finally {
  busy = false;
  if (button) {
   button.disabled = false;
   button.textContent = "GUARDAR LISTA";
  }
 }
}

function sourceUrlIsHttp(url) {
 return /^http:\/\//i.test((url || "").trim());
}

function stopPlayer() {
 if (hls) {
  try { hls.destroy(); } catch {}
  hls = null;
 }
 video.pause();
 video.removeAttribute("src");
 video.load();
}

function playChannel(channel) {
 activeChannelId = channel.id;
 stopPlayer();
 $("empty-state").style.display = "none";
 $("now-playing").textContent = "▶ " + channel.name;
 $("now-playing").classList.add("visible");
 setTimeout(() => $("now-playing").classList.remove("visible"),4500);

 localStorage.setItem("plaza_last_channel",JSON.stringify({
  id:channel.id,playlistId:channel.playlistId,name:channel.name,url:channel.url
 }));

 setMenu(false);
 renderView();

 if (window.Hls && Hls.isSupported()) {
  hls = new Hls({
   enableWorker:true,
   lowLatencyMode:false,
   maxBufferLength:20,
   maxMaxBufferLength:45,
   manifestLoadingTimeOut:20000,
   levelLoadingTimeOut:20000,
   fragLoadingTimeOut:30000,
   manifestLoadingMaxRetry:2,
   levelLoadingMaxRetry:2,
   fragLoadingMaxRetry:3
  });
  const instance = hls;
  instance.on(Hls.Events.ERROR,(event,data) => {
   if (instance !== hls || !data.fatal) return;
   if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
    notify("Problema de conexión con " + channel.name);
    try { instance.startLoad(); } catch {}
   } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
    try { instance.recoverMediaError(); }
    catch { notify("No se pudo recuperar la reproducción."); }
   } else {
    notify("No fue posible reproducir este canal.");
    stopPlayer();
   }
  });
  instance.on(Hls.Events.MANIFEST_PARSED,() => {
   if (instance === hls) video.play().catch(() => notify("Pulsa PLAY para iniciar."));
  });
  instance.loadSource(channel.url);
  instance.attachMedia(video);
 } else {
  video.src = channel.url;
  video.play().catch(() => notify("Pulsa PLAY para iniciar el canal."));
 }
}

function playRelative(direction) {
 if (!channels.length) return;
 let index = channels.findIndex(c => c.id === activeChannelId);
 if (index < 0) index = 0;
 else index = (index + direction + channels.length) % channels.length;
 playChannel(channels[index]);
}

function finishSplash() {
 if (splashFinished) return;
 splashFinished = true;
 $("splash").classList.add("hidden");
 setTimeout(() => $("splash").style.display = "none",500);

 const saved = lastChannel;
 if (saved) {
  const match = channels.find(c => c.url === saved.url) ||
   channels.find(c => c.playlistId === saved.playlistId && c.name === saved.name);
  if (match) {
   playChannel(match);
   return;
  }
 }
 setMenu(true);
}

function updateClock() {
 $("clock").textContent = new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
}

function handleKeys(event) {
 const key = event.key;
 const code = event.keyCode || event.which;
 const target = event.target;
 const typing = target && (
  target.tagName === "INPUT" ||
  target.tagName === "TEXTAREA" ||
  target.tagName === "SELECT"
 );

 if (key === "Escape" || key === "Backspace" || code === 27) {
  if ($("dialog-overlay").classList.contains("show")) {
   closeDialog();event.preventDefault();return;
  }
  if (menuOpen) {
   setMenu(false);event.preventDefault();return;
  }
  if (splashFinished) { setMenu(true);event.preventDefault(); }
  return;
 }

 if (typing) return;

 // Compatibilidad con mandos que reportan OK como Enter o keyCode 13.
 if (key === "Enter" || key === "OK" || key === "Select" || code === 13 || code === 23) {
  if ($("dialog-overlay").classList.contains("show")) return;
  if (!menuOpen) {
   setMenu(true);
   event.preventDefault();
   return;
  }
  if (target === document.body || target === $("app") || target === $("player-area") || target === video) {
   setMenu(false);
   event.preventDefault();
   return;
  }
 }

 if (key === "ArrowLeft" || code === 37) {
  setMenu(true);event.preventDefault();return;
 }
 if (key === "ArrowRight" || code === 39) {
  if (menuOpen) setMenu(false);
  event.preventDefault();return;
 }

 if ((key === "ArrowDown" || code === 40) && menuOpen) {
  if (channelButtons.length) {
   let i = channelButtons.indexOf(document.activeElement);
   i = Math.min(i+1,channelButtons.length-1);
   channelButtons[i].focus();
   channelButtons[i].scrollIntoView({block:"nearest"});
   event.preventDefault();
  }
  return;
 }
 if ((key === "ArrowUp" || code === 38) && menuOpen) {
  if (channelButtons.length) {
   let i = channelButtons.indexOf(document.activeElement);
   i = Math.max(i-1,0);
   channelButtons[i].focus();
   channelButtons[i].scrollIntoView({block:"nearest"});
   event.preventDefault();
  }
  return;
 }

 if (key === "PageDown") { playRelative(1);event.preventDefault(); }
 if (key === "PageUp") { playRelative(-1);event.preventDefault(); }
}

$("open-menu").addEventListener("click",toggleMenu);
$("menu-backdrop").addEventListener("click",() => setMenu(false));
document.querySelectorAll(".tab-btn").forEach(button => {
 button.addEventListener("click",() => setTab(button.dataset.tab));
});
$("search").addEventListener("input",renderChannels);
document.addEventListener("keydown",handleKeys);
$("app").addEventListener("click",event => {
 if (event.target === $("player-area") || event.target === $("empty-state")) {
  $("app").focus({preventScroll:true});
 }
});
$("dialog-overlay").addEventListener("click",event => {
 if (event.target === $("dialog-overlay")) closeDialog();
});
video.addEventListener("error",() => {
 if (video.currentSrc) notify("No se pudo reproducir el canal. Comprueba la dirección o disponibilidad.");
});

async function start() {
 lastChannel = (() => {
  try { return JSON.parse(localStorage.getItem("plaza_last_channel") || "null"); }
  catch { return null; }
 })();

 if (lastChannel?.name) {
  $("last-channel-label").textContent = "Último canal sintonizado: " + lastChannel.name;
 }

 try {
  db = await openDB();
  await reloadData();
 } catch(error) {
  notify("No se pudo abrir el almacenamiento de listas.");
 }

 updateClock();
 setInterval(updateClock,30000);
 splashTimer = setTimeout(finishSplash,7000);
}

start();
})();
</script>
