<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hisense TV IPTV Pro</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg-glass: rgba(10, 13, 18, 0.82);
      --bg-glass-solid: #0a0d12;
      --bg-item: rgba(255, 255, 255, 0.05);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.45);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --item-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #player-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1;
    }

    #video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #status-pill {
      position: fixed;
      top: 28px;
      right: 36px;
      z-index: 50;
      background: var(--bg-glass);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    #status-pill.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #sidebar-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 760px;
      max-width: 88vw;
      height: 100vh;
      z-index: 20;
      display: flex;
      background: var(--bg-glass-solid);
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      transform: translateX(0);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #sidebar-drawer.hidden {
      transform: translateX(-105%);
    }

    #groups-pane {
      width: 270px;
      height: 100%;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 24px 14px;
    }

    .pane-header {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 16px;
      padding: 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #groups-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: none;
    }
    #groups-list::-webkit-scrollbar { display: none; }

    .group-item {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 17px;
      color: var(--text-muted);
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .group-item.active {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      font-weight: 600;
    }

    .group-count {
      font-size: 13px;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
    }

    #channels-pane {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
    }

    #channels-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #channels-virtual-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      will-change: transform;
    }

    .channel-item {
      height: 58px;
      margin-bottom: 6px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--bg-item);
      display: flex;
      align-items: center;
      gap: 14px;
      border: 2px solid transparent;
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }

    .channel-item.playing {
      background: rgba(0, 210, 255, 0.14);
      border-color: rgba(0, 210, 255, 0.35);
    }

    .ch-num {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 38px;
    }

    .ch-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px;
      flex-shrink: 0;
    }

    .ch-name {
      flex: 1;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-fav {
      color: var(--warning);
      font-size: 18px;
    }

    .focused {
      background: var(--accent) !important;
      color: #000 !important;
      border-color: #ffffff !important;
      transform: scale(1.025);
      box-shadow: 0 0 22px var(--accent-glow);
      font-weight: 700 !important;
      z-index: 5;
    }

    .focused .ch-num,
    .focused .group-count {
      color: #000 !important;
      background: rgba(0, 0, 0, 0.15) !important;
    }

    #osd-bar {
      position: fixed;
      bottom: 28px;
      left: 36px;
      right: 36px;
      z-index: 15;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #osd-bar.hidden {
      opacity: 0;
      transform: translateY(30px);
      pointer-events: none;
    }

    .osd-info {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    #osd-logo {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px;
    }

    #osd-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    #osd-meta {
      font-size: 15px;
      color: var(--accent);
      display: flex;
      gap: 14px;
      font-weight: 600;
    }

    .remote-hints {
      display: flex;
      gap: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .hint-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.07);
      padding: 6px 12px;
      border-radius: 8px;
    }

    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .dot-red { background: #ef4444; }
    .dot-green { background: #10b981; }
    .dot-yellow { background: #f59e0b; }
    .dot-blue { background: #3b82f6; }

    #settings-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
    }

    #settings-modal.open {
      display: flex;
    }

    .modal-card {
      width: 720px;
      max-width: 92vw;
      background: #111622;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 15px;
      color: var(--text-muted);
    }

    .tv-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 17px;
    }

    .tv-btn {
      padding: 14px 20px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .saved-playlists {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      border: 2px solid transparent;
    }
  </style>
</head>
<body>

  <div id="player-container">
    <video id="video-player" playsinline autoplay></video>
  </div>

  <div id="status-pill">
    <div class="spinner" id="status-spinner"></div>
    <span id="status-text">Cargando canal...</span>
  </div>

  <aside id="sidebar-drawer">
    <div id="groups-pane">
      <div class="pane-header">
        <span>Categorías</span>
        <span id="total-count">0</span>
      </div>
      <div id="groups-list"></div>
    </div>

    <div id="channels-pane">
      <div class="pane-header">
